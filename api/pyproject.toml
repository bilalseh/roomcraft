[project]
name = "roomcraft-api"
version = "0.1.0"
description = "Backend for Roomcraft: validates AI layout operations for the 3D room planner."
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.162",
    "firebase-admin>=7.7",
    "google-genai>=2.34",
    "pydantic>=2.14",
    "pydantic-settings>=2.16",
    "uvicorn[standard]>=0.54",
]

[dependency-groups]
dev = [
    "httpx2>=2.16",
    "mypy>=2.4",
    "pytest>=9.2",
    "ruff>=0.17",
]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
  "E", "W", "F", "I", "N", "UP", "B", "A", "C4", "SIM", "PT", "RET",
  "S", "ASYNC", "PTH", "TID", "RUF",
]

[tool.ruff.lint.per-file-ignores]
# Tests assert, and use made-up tokens.
"tests/**" = ["S101", "S105", "S106"]

[tool.mypy]
strict = true
files = ["src", "tests", "scripts"]
plugins = ["pydantic.mypy"]

# firebase-admin ships no type information.
[[tool.mypy.overrides]]
module = ["firebase_admin", "firebase_admin.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "--strict-config"]
xfail_strict = true
